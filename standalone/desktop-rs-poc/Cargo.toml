[package]
name = "pi-code-desktop-poc"
version = "0.0.1"
edition = "2021"
publish = false
description = "Throwaway visual proof-of-concept for the standalone desktop native migration. Bevy variant. See dev-notes/poc-visual-proof.md."

[dependencies]
bevy = "0.19"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Fastest debug rebuilds — Bevy's own crates are optimized, our code compiles fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
